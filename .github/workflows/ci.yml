name: CI — Periodic Router & Cloud Run Gateway

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,gateway]"
      - name: Run unit and FastAPI gateway tests
        run: pytest -v
      - name: Verify Python bytecode compilation
        run: python -m compileall -q app benchmarks tests
